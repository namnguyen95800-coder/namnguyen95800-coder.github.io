           dict(k='pace', slug='pace-chay-bo', name='Pace chạy bộ', title='Tính pace chạy bộ online, dự đoán thời gian 5K, 10K, marathon', desc='Nhập quãng đường và thời gian để biết pace mỗi km, tốc độ km/h và dự đoán thời gian chạy 5 km, 10 km, bán marathon, marathon. Miễn phí.', lead='Pace là thời gian để chạy hết một kilômét. Nhập quãng đường và thời gian bạn đã chạy, công cụ tính ra pace, tốc độ và ước lượng thời gian cho các cự ly phổ biến.', feats=['Tính pace mỗi km (phút:giây) và tốc độ km/h', 'Dự đoán thời gian 5 km, 10 km, bán marathon và marathon bằng công thức Riegel', 'Nhớ lần nhập gần nhất trên máy của bạn', 'Dùng được ngay trên điện thoại sau buổi chạy'], steps=['Mở Pace chạy bộ.', 'Nhập quãng đường (km).', 'Nhập thời gian bằng giờ, phút, giây.', 'Xem pace, tốc độ và các dự đoán bên dưới.'], faq=[('Pace là gì?', 'Pace là thời gian để chạy hết một kilômét, ví dụ 5:30 nghĩa là 5 phút 30 giây mỗi km. Pace càng thấp thì chạy càng nhanh.'), ('Dự đoán có chính xác không?', 'Chỉ mang tính tham khảo. Công thức Riegel giả định bạn giữ sức tương đương ở cự ly dài hơn, trong khi sức bền thực tế, địa hình và thời tiết sẽ khác.')], rel=['vung-nhip-tim', 'dem-lan', 'tap-luyen']),
           dict(k='zone', slug='vung-nhip-tim', name='Vùng nhịp tim', title='Tính vùng nhịp tim khi tập luyện theo tuổi', desc='Nhập tuổi để biết nhịp tim tối đa ước tính và 5 vùng nhịp tim khi tập luyện, có tùy chọn Karvonen với nhịp tim lúc nghỉ. Chỉ để tham khảo.', lead='Biết mình đang tập ở vùng nhịp tim nào giúp bạn điều chỉnh cường độ: nhẹ để xây nền sức bền, nặng để tăng tốc. Công cụ tính 5 vùng từ tuổi của bạn.', feats=['Nhịp tim tối đa ước tính bằng 220 trừ tuổi', 'Năm vùng từ rất nhẹ đến tối đa, hiện theo số nhịp mỗi phút', 'Nhập nhịp tim lúc nghỉ để dùng công thức Karvonen', 'Có lưu ý an toàn cho người có bệnh tim'], steps=['Mở Vùng nhịp tim.', 'Nhập tuổi của bạn.', 'Nếu biết, nhập nhịp tim lúc nghỉ.', 'Đối chiếu nhịp tim khi tập với 5 vùng.'], faq=[('Nhịp tim tối đa bằng 220 trừ tuổi có chính xác không?', 'Đó chỉ là ước tính, và sai lệch giữa từng người có thể lớn. Hãy xem kết quả là gợi ý, không phải số đo chính xác.'), ('Karvonen khác gì?', 'Karvonen tính vùng dựa trên khoảng chênh giữa nhịp tim tối đa và nhịp tim lúc nghỉ, nên thường sát với thể trạng từng người hơn.'), ('Người có bệnh tim có dùng được không?', 'Nếu bạn có bệnh tim hoặc dùng thuốc ảnh hưởng nhịp tim, hãy hỏi bác sĩ trước khi tập theo các vùng này.')], rel=['pace-chay-bo', 'tap-luyen', 'dem-lan']),
           dict(k='tally', slug='dem-lan', name='Đếm lần', title='Đếm số lần tập online: hít đất, gập bụng, nhảy dây', desc='Bộ đếm lần với nút +1 lớn, lưu từng hiệp, đặt mục tiêu mỗi hiệp. Dùng cho hít đất, gập bụng, nhảy dây. Miễn phí, chạy trên điện thoại.', lead='Khi tập, bạn cần một nút đủ lớn để bấm mà không phải nhìn kỹ. Đếm lần cho bạn đúng thứ đó: bấm +1 sau mỗi cái, lưu từng hiệp và xem tổng.', feats=['Nút +1 rất lớn, dễ bấm khi đang tập', 'Lưu hiệp để chốt một hiệp và đếm tiếp hiệp mới, xem tổng cộng', 'Đặt mục tiêu mỗi hiệp; máy rung nhẹ khi đạt mục tiêu nếu thiết bị hỗ trợ', 'Số đếm được lưu trong máy, không mất khi bạn chuyển công cụ'], steps=['Mở Đếm lần và đặt mục tiêu mỗi hiệp.', 'Bấm +1 sau mỗi lần làm xong một cái.', 'Bấm Lưu hiệp khi hết một hiệp.', 'Bấm Làm lại để xóa số đếm và các hiệp.'], faq=[('Bấm nhầm thì sao?', 'Bấm −1 để giảm đi một.'), ('Số đếm có mất khi đóng trang không?', 'Không. Số đếm và các hiệp được lưu trong máy của bạn cho đến khi bạn bấm Làm lại.')], rel=['tap-luyen', 'pace-chay-bo', 'vung-nhip-tim']),
           dict(k='water', slug='uong-nuoc', name='Uống nước', title='Theo dõi uống nước mỗi ngày, ghi lượng nước online', desc='Ghi mỗi lần uống nước bằng một chạm, đặt mục tiêu ml mỗi ngày và xem 6 ngày trước. Dữ liệu lưu trong máy bạn. Miễn phí.', lead='Ghi nhanh mỗi lần uống nước để biết hôm nay đã uống bao nhiêu so với mục tiêu bạn tự đặt.', feats=['Nút +150, +250, +500 ml hoặc nhập số khác', 'Thanh tiến độ theo mục tiêu mỗi ngày bạn tự đặt', 'Hoàn tác lần ghi nhầm; mỗi ngày tự tính lại từ đầu', 'Xem lượng nước của 6 ngày trước'], steps=['Mở Uống nước và đặt mục tiêu mỗi ngày (ml).', 'Bấm +150, +250 hoặc +500 sau mỗi lần uống.', 'Hoặc nhập số ml khác rồi bấm Thêm.', 'Bấm Hoàn tác nếu ghi nhầm.'], faq=[('Mỗi ngày nên uống bao nhiêu nước?', 'Nhu cầu khác nhau tùy cơ thể, thời tiết và mức vận động nên công cụ để bạn tự đặt mục tiêu. Nếu cần lời khuyên cụ thể, hãy hỏi bác sĩ hoặc chuyên gia dinh dưỡng.'), ('Công cụ có nhắc tôi uống nước không?', 'Công cụ này chỉ ghi lại. Muốn được nhắc theo giờ, hãy dùng Nhắc nhở định kỳ.')], rel=['nhac-nho', 'chuoi-thoi-quen', 'tap-luyen']),
           dict(k='spaced', slug='on-tap-cach-quang', name='Ôn tập cách quãng', title='Lịch ôn tập cách quãng: ôn bài sau 1, 3, 7, 14, 30 ngày', desc='Ghi nội dung vừa học, công cụ gợi ý lịch ôn lại sau 1, 3, 7, 14 và 30 ngày để nhớ lâu hơn. Dữ liệu lưu trong máy, miễn phí.', lead='Ôn tập cách quãng là ôn lại bài vào những thời điểm giãn dần thay vì học dồn một lúc. Công cụ giữ danh sách và cho bạn biết mục nào đến hạn ôn.', feats=['Thêm nhiều nội dung, mỗi mục có ngày học riêng', 'Hiện ngày ôn tiếp theo, báo màu đỏ khi đến hạn hoặc trễ', 'Bấm Đã ôn để chuyển sang mốc xa hơn, tính từ lần ôn gần nhất', 'Dữ liệu chỉ lưu trong máy của bạn'], steps=['Mở Ôn tập cách quãng.', 'Nhập nội dung vừa học và ngày học rồi bấm Thêm.', 'Đến ngày hẹn, ôn bài rồi bấm Đã ôn.', 'Lặp lại cho đến khi hoàn thành 5 lần ôn.'], faq=[('Các mốc ôn là gì?', 'Sau 1, 3, 7, 14 rồi 30 ngày, mỗi mốc tính từ lần ôn gần nhất.'), ('Tôi ôn trễ thì sao?', 'Mục đó báo trễ bao nhiêu ngày. Bạn cứ ôn rồi bấm Đã ôn, mốc kế tiếp sẽ tính từ ngày bạn vừa ôn.'), ('Công cụ có tự nhắc không?', 'Công cụ cho thấy mục nào đến hạn khi bạn mở trang, chưa gửi thông báo riêng.')], rel=['pomodoro', 'tien-do-den-han', 'dem-tu']),
           dict(k='plan', slug='tien-do-den-han', name='Tiến độ đến hạn', title='Tính mỗi ngày cần làm bao nhiêu để kịp hạn', desc='Nhập hạn hoàn thành, tổng khối lượng và phần đã làm để biết mỗi ngày phải làm bao nhiêu. Có tùy chọn nghỉ Chủ nhật và dự phòng 20%.', lead='Có một hạn chót và một khối lượng lớn? Công cụ chia đều cho các ngày còn lại để bạn biết mỗi ngày cần hoàn thành bao nhiêu.', feats=['Tính số ngày làm việc còn lại đến hạn, có tùy chọn nghỉ Chủ nhật', 'Cho biết mức cần làm mỗi ngày', 'Thêm con số nếu muốn xong sớm với 20% thời gian dự phòng', 'Tự đặt đơn vị: trang, bài, việc, từ...'], steps=['Mở Tiến độ đến hạn.', 'Chọn hạn hoàn thành.', 'Nhập tổng khối lượng, phần đã làm và đơn vị.', 'Xem mỗi ngày cần làm bao nhiêu.'], faq=[('Ngày hôm nay có được tính không?', 'Có, hôm nay được tính là một ngày làm việc, trừ khi hôm nay là Chủ nhật và bạn chọn nghỉ Chủ nhật.'), ('Nếu đã quá hạn thì sao?', 'Công cụ báo đã quá hạn bao nhiêu ngày và phần còn lại là bao nhiêu.'), ('Dự phòng 20% nghĩa là gì?', 'Là mức cần làm mỗi ngày nếu bạn muốn hoàn thành khi còn khoảng 20% thời gian, để có chỗ trống cho sự cố.')], rel=['pomodoro', 'on-tap-cach-quang', 'dem-ngay']),
           dict(k='words', slug='dem-tu', name='Đếm từ', title='Đếm từ và ký tự online, tính thời gian đọc và thuyết trình', desc='Dán văn bản để đếm số từ, ký tự, số câu và ước tính thời gian đọc thầm, thời gian nói thuyết trình. Văn bản không được lưu. Miễn phí.', lead='Cần biết bài viết dài bao nhiêu từ, đọc mất mấy phút hay thuyết trình hết bao lâu? Dán văn bản vào và xem ngay kết quả.', feats=['Đếm từ, ký tự (có và không tính khoảng trắng) và số câu', 'Ước tính thời gian đọc thầm và thời gian nói', 'Tự chỉnh tốc độ đọc và nói (từ mỗi phút)', 'Văn bản bạn dán không được lưu lại'], steps=['Mở Đếm từ.', 'Dán hoặc gõ văn bản vào ô.', 'Xem số từ, ký tự và số câu.', 'Chỉnh tốc độ đọc, nói nếu cần để thời gian sát với bạn hơn.'], faq=[('Từ được đếm thế nào?', 'Công cụ đếm các cụm ngăn cách bởi khoảng trắng, cách đếm giống Word. Với tiếng Việt, mỗi tiếng được tính là một từ.'), ('Tốc độ mặc định là bao nhiêu?', 'Đọc thầm 200 từ mỗi phút và nói 130 từ mỗi phút, chỉ là mức tham khảo. Bạn có thể đổi.'), ('Văn bản của tôi có bị lưu không?', 'Không. Văn bản chỉ nằm trong trình duyệt và mất khi bạn đóng trang.')], rel=['dong-ho-thi', 'pomodoro', 'tien-do-den-han']),
           dict(k='week', slug='tuan-trong-nam', name='Tuần trong năm', title='Hôm nay là tuần thứ mấy, ngày thứ mấy trong năm?', desc='Chọn một ngày để biết đó là tuần thứ mấy theo chuẩn ISO, ngày thứ mấy trong năm, quý mấy và đã qua bao nhiêu phần trăm năm. Miễn phí.', lead='Xem nhanh một ngày bất kỳ là tuần thứ mấy, ngày thứ mấy trong năm và thuộc quý nào, rất tiện khi lên kế hoạch hay làm báo cáo.', feats=['Số tuần theo chuẩn ISO 8601, tuần bắt đầu từ thứ Hai', 'Ngày thứ mấy trong năm và còn bao nhiêu ngày', 'Quý và phần trăm năm đã qua', 'Nút Hôm nay để quay về ngày hiện tại'], steps=['Mở Tuần trong năm.', 'Chọn ngày muốn xem, hoặc bấm Hôm nay.', 'Đọc số tuần, ngày thứ mấy, quý và phần trăm năm.'], faq=[('Tuần ISO là gì?', 'Là cách đánh số tuần quốc tế: tuần bắt đầu từ thứ Hai, tuần 1 là tuần chứa ngày thứ Năm đầu tiên của năm. Một năm có 52 hoặc 53 tuần.'), ('Vì sao ngày đầu năm đôi khi thuộc tuần 52 hoặc 53 của năm trước?', 'Do quy ước ISO, những ngày đầu tháng 1 có thể thuộc tuần cuối của năm trước, và ngược lại. Công cụ ghi rõ khi trường hợp này xảy ra.')], rel=['tinh-ngay', 'dem-ngay', 'tinh-tuoi']),
           dict(k='leave', slug='gio-xuat-phat', name='Giờ xuất phát', title='Tính giờ xuất phát để kịp giờ: đi làm, đi học, đi hẹn', desc='Nhập giờ cần đến, thời gian di chuyển, dự phòng và thời gian chuẩn bị để biết phải xuất phát và bắt đầu chuẩn bị lúc mấy giờ. Miễn phí.', lead='Biết giờ cần đến nhưng không chắc mấy giờ phải ra khỏi nhà? Công cụ tính ngược từ giờ đến, có cộng dự phòng và thời gian chuẩn bị.', feats=['Tính ngược từ giờ cần đến', 'Cộng thêm thời gian dự phòng cho kẹt xe, tìm chỗ gửi xe', 'Cho biết giờ nên bắt đầu chuẩn bị', 'Hiện còn bao lâu nữa đến giờ xuất phát'], steps=['Mở Giờ xuất phát.', 'Chọn giờ cần đến.', 'Nhập thời gian di chuyển, dự phòng và thời gian chuẩn bị (phút).', 'Xem giờ xuất phát và giờ bắt đầu chuẩn bị.'], faq=[('Nên dự phòng bao nhiêu phút?', 'Tùy quãng đường và giờ giao thông. Giờ cao điểm hoặc trời mưa nên dự phòng nhiều hơn mức bạn nghĩ.'), ('Giờ cần đến sau nửa đêm thì sao?', 'Công cụ tính được cả trường hợp giờ xuất phát rơi vào hôm trước và ghi chú rõ.')], rel=['cong-tru-gio', 'tinh-luong-gio', 'gio-the-gioi']),
          ]
          MORE = {'bam-gio': ('Mẹo dùng bấm giờ để đo thời gian chính xác', 'Bấm giờ phù hợp khi bạn muốn biết một việc thật sự mất bao lâu: chạy một vòng sân, làm một bài tập, thuyết trình thử hay nấu một món quen thuộc. Thay vì đoán, hãy đo vài lần rồi lấy mức trung bình. Con số thật thường khác khá nhiều so với cảm giác của bạn.', 'Khi luyện tập, hãy ghi vòng ở mỗi mốc cố định, ví dụ mỗi 400 mét hoặc mỗi trang bài. Nhìn danh sách vòng, bạn sẽ thấy mình chậm dần ở đoạn nào và điều chỉnh nhịp cho lần sau. Với việc cần đo lâu, hãy cắm sạc và giữ trang mở.'),
           'dem-nguoc': ('Khi nào nên dùng đếm ngược', 'Đếm ngược hợp với mọi việc có thời gian cố định: luộc trứng, ủ trà, đắp mặt nạ, ngủ trưa hay giới hạn thời gian lướt mạng. Đặt hẹn giờ trước khi bắt đầu giúp bạn không phải liên tục nhìn đồng hồ, đầu óc nhẹ hơn.', 'Một mẹo nhỏ là đặt thời gian ngắn hơn dự định một chút rồi gia hạn nếu cần. Với giấc ngủ trưa, khoảng 20 phút thường đủ để tỉnh táo mà không bị uể oải khi dậy. Hãy bật âm thanh và chọn tiếng báo đủ to để bạn nghe thấy.'),
           'pomodoro': ('Cách dùng Pomodoro để tập trung hơn', 'Sức mạnh của Pomodoro nằm ở việc chia nhỏ. Thay vì nghĩ phải học cả buổi, bạn chỉ cần cam kết một phiên 25 phút làm đúng một việc. Trong phiên, hãy tắt thông báo và ghi nhanh những ý nghĩ chợt đến ra giấy để xử lý sau.', 'Nếu 25 phút quá ngắn với việc cần suy nghĩ sâu, hãy thử mẫu 50/10. Nếu bạn dễ nản, thử 15/3 rồi tăng dần. Quan trọng là nghỉ thật sự: đứng dậy, uống nước, nhìn ra xa, thay vì chuyển sang lướt điện thoại.'),
           'tap-luyen': ('Hẹn giờ tập luyện cho từng mục tiêu', 'HIIT và Tabata dựa trên việc tập thật mạnh trong thời gian ngắn rồi nghỉ ngắn. Dùng đồng hồ giúp bạn giữ đúng nhịp mà không phải đếm trong đầu, nên có thể dồn sức vào động tác. Hãy bắt đầu với số vòng ít và tăng dần theo thể lực.', 'Plank, kéo giãn hay nhảy dây cũng hợp với hẹn giờ vì bạn biết rõ còn bao lâu nữa là xong. Hãy khởi động trước, uống đủ nước và dừng ngay nếu thấy đau hay chóng mặt. Nếu có bệnh nền hoặc chấn thương, nên hỏi ý kiến bác sĩ trước khi tập cường độ cao.'),
           'chuoi-buoc': ('Biến thói quen thành quy trình có giờ', 'Nhiều việc lặp lại mỗi ngày có thể chia thành các bước ngắn: dậy, uống nước, giãn cơ, thiền ngắn, chuẩn bị đồ. Khi mỗi bước có thời gian riêng và tự chuyển tiếp, bạn đỡ phải quyết định giữa chừng và dễ giữ nhịp hơn.', 'Hãy bắt đầu với quy trình 3 đến 5 bước và để dư thời gian một chút. Dùng vài hôm, bạn sẽ biết bước nào hay bị trễ để điều chỉnh. Quy trình đã lưu có thể dùng lại mỗi ngày hoặc chia sẻ cho người khác bằng liên kết.'),
           'dong-ho-thi': ('Chia thời gian làm bài với đồng hồ thi', 'Làm bài thi tốt không chỉ cần kiến thức mà còn cần phân bổ thời gian hợp lý. Trước khi bắt đầu, hãy tính mỗi phần được bao nhiêu phút rồi đặt mốc báo tương ứng, để biết lúc nào nên chuyển sang câu khác thay vì sa lầy.', 'Khi luyện đề ở nhà, hãy tập trong điều kiện giống thi thật: đúng thời lượng, không tra cứu, không tạm dừng. Sau mỗi lần, ghi lại phần nào bị quá giờ để cải thiện. Dùng chế độ toàn màn hình nếu muốn nhìn đồng hồ từ xa.'),
           'dem-ngay': ('Đếm ngày cho những mốc quan trọng', 'Biết còn bao nhiêu ngày đến Tết, đến kỳ thi hay đến chuyến đi giúp bạn lên kế hoạch thực tế hơn. Chia số ngày còn lại cho khối lượng việc cần làm, bạn sẽ thấy mỗi ngày cần hoàn thành được bao nhiêu.', 'Ngoài ngày lễ có sẵn, bạn có thể thêm sinh nhật, kỷ niệm hoặc hạn nộp hồ sơ. Các ngày lễ theo âm lịch như Tết Nguyên Đán, Trung thu hay Giỗ Tổ được tự đổi sang dương lịch của từng năm, nên bạn không cần tra lịch thủ công.'),
           'dong-ho-co-vua': ('Chọn thể thức thời gian cho ván cờ', 'Bullet thường là ván siêu nhanh khoảng một đến hai phút mỗi bên, Blitz khoảng 3 đến 5 phút, còn Rapid từ 10 phút trở lên và hợp để suy nghĩ kỹ hơn. Người mới nên bắt đầu với Rapid để quen nhịp trước khi chơi nhanh.', 'Thời gian cộng thêm mỗi nước giúp tránh cảnh hết giờ khi thế cờ đã thắng. Khi chơi chung một điện thoại, hãy đặt máy ở giữa bàn và chạm đúng nút phía mình sau mỗi nước đi. Bật toàn màn hình để cả hai cùng nhìn rõ.'),
           'hen-gio-nau-an': ('Canh giờ khi nấu nhiều món', 'Khi nấu nhiều món cùng lúc, sai lầm phổ biến là quên một nồi trên bếp. Mỗi món một đồng hồ riêng với tên rõ ràng giúp bạn biết món nào sắp xong, món nào cần để thêm. Hãy bắt đầu món lâu chín nhất trước.', 'Thời gian trong công thức chỉ là ước chừng vì còn phụ thuộc vào bếp, nồi và kích cỡ nguyên liệu. Hãy dùng hẹn giờ như lời nhắc để kiểm tra món, rồi nếm hoặc xem độ chín trước khi tắt bếp. Đừng rời bếp khi đang chiên hay đun dầu.'),
           'hit-tho': ('Hít thở có nhịp để thư giãn', 'Thở chậm và đều là cách đơn giản để cơ thể chuyển sang trạng thái nghỉ. Nhiều người dùng bài tập này khi căng thẳng, trước khi ngủ hoặc giữa các phiên làm việc. Chỉ cần vài phút là đủ để cảm nhận sự khác biệt.', 'Hãy ngồi hoặc nằm thoải mái, thở bằng mũi và đừng gắng sức. Nếu giữ hơi khiến bạn khó chịu hay chóng mặt, hãy rút ngắn thời gian giữ hoặc chọn kiểu thở đều 5-5. Đây không phải phương pháp điều trị; người có bệnh hô hấp hay tim mạch nên hỏi bác sĩ.'),
           'nhac-nho': ('Nhắc nghỉ mắt và vận động khi làm việc lâu', 'Nhìn màn hình liên tục dễ làm mắt mỏi và khô. Quy tắc 20-20-20 là thói quen đơn giản: cứ 20 phút, nhìn một vật cách khoảng 6 mét trong 20 giây. Đặt nhắc nhở lặp lại để không phải tự nhớ.', 'Bạn cũng có thể thêm nhắc uống nước hoặc đứng dậy đi lại mỗi giờ. Hãy đặt nội dung nhắc ngắn, cụ thể như Uống nước, Nhìn xa, Vươn vai. Công cụ cần để trang mở thì mới nhắc đúng giờ, nên hợp khi bạn làm việc trước máy tính.'),
           'gio-the-gioi': ('Xem giờ quốc tế không bị nhầm', 'Gọi điện cho người thân ở nước ngoài hay họp với khách hàng ở múi giờ khác rất dễ nhầm, nhất là khi một bên chuyển sang giờ mùa hè. Thêm các thành phố liên quan vào một danh sách để thấy giờ hiện tại và chênh lệch cùng lúc.', 'Khi hẹn giờ, hãy ghi rõ kèm múi giờ hoặc thành phố trong tin nhắn, ví dụ 20:00 giờ Việt Nam. Nếu cần tìm khung giờ phù hợp cho nhiều người, hãy dùng công cụ Họp chung thay vì tự cộng trừ.'),
           'tinh-gio-ngu': ('Hiểu chu kỳ ngủ để dậy dễ chịu hơn', 'Giấc ngủ diễn ra theo các chu kỳ, mỗi chu kỳ trung bình khoảng 90 phút. Thức dậy ở cuối một chu kỳ thường dễ chịu hơn so với bị đánh thức giữa giấc ngủ sâu. Công cụ giúp bạn chọn giờ đi ngủ hoặc giờ dậy phù hợp.', 'Đừng quên cộng thêm khoảng 10 đến 20 phút để chìm vào giấc ngủ. Mỗi người có chu kỳ và nhu cầu ngủ khác nhau, nên hãy xem kết quả là gợi ý và tự điều chỉnh theo cảm giác. Nếu thường xuyên mất ngủ hoặc mệt kéo dài, hãy gặp bác sĩ.'),
           'tinh-ngay': ('Tính ngày trong công việc và đời sống', 'Tính số ngày giữa hai mốc hữu ích khi bạn cần biết một dự án đã kéo dài bao lâu, còn bao nhiêu ngày đến hạn nộp hoặc đã qua bao nhiêu ngày kể từ một sự kiện. Chế độ cộng trừ cho biết ngày sẽ rơi vào lúc nào sau một khoảng thời gian.', 'Hãy lưu ý cách tính của từng trường hợp: có tính cả ngày đầu hay không, tính ngày làm việc hay ngày lịch. Với hợp đồng, bảo hành hay thủ tục pháp lý, hãy đối chiếu với cách tính ghi trong văn bản. Công cụ này phù hợp để ước tính nhanh.'),
           'lich-am': ('Dùng lịch âm đúng cách', 'Lịch âm vẫn gắn với nhiều dịp quan trọng của người Việt như Tết, rằm, giỗ chạp và các lễ hội. Công cụ đổi qua lại giữa dương lịch và âm lịch, hỗ trợ tháng nhuận, giúp bạn xác định ngày cho đúng.', 'Cùng một ngày âm lịch có thể rơi vào ngày dương khác nhau mỗi năm, nên với giỗ hay ngày kỷ niệm, hãy đổi lại từng năm. Với việc hệ trọng như cưới hỏi hay xem ngày, nên đối chiếu thêm với lịch chính thức hoặc người có hiểu biết.'),
           'tinh-tuoi': ('Tính tuổi chính xác và những điều thú vị', 'Ngoài số tuổi theo năm, công cụ cho biết bạn đã sống bao nhiêu tháng, bao nhiêu ngày, thậm chí bao nhiêu giờ, cùng số ngày còn lại đến sinh nhật tiếp theo. Đây là cách vui để nhìn lại một cột mốc, như ngày thứ 10.000 của bạn.', 'Tuổi tính ở đây là tuổi dương lịch theo ngày sinh. Một số thủ tục yêu cầu cách tính khác, ví dụ tính theo năm sinh hoặc theo ngày đủ tuổi, nên hãy kiểm tra quy định cụ thể. Ngày sinh bạn nhập chỉ được lưu trong máy.'),
           'cong-tru-gio': ('Tính giờ làm và giờ học nhanh', 'Nếu bạn làm ca hoặc làm tự do, việc cộng trừ giờ phút bằng tay rất dễ sai, nhất là với ca qua nửa đêm. Nhập giờ bắt đầu và kết thúc để biết ngay tổng số giờ, kể cả dạng số thập phân để nhân với đơn giá.', 'Ví dụ 7 giờ 30 phút tương đương 7,5 giờ. Hãy nhớ trừ giờ nghỉ trưa hoặc nghỉ giải lao nếu hợp đồng không tính. Khi cần cộng nhiều khoảng giờ trong tuần, bạn có thể cộng từng cặp rồi ghi lại tổng.'),
           'dong-ho-de-ban': ('Biến điện thoại thành đồng hồ để bàn', 'Một điện thoại cũ có thể thành đồng hồ để bàn hoặc đồng hồ đầu giường với số lớn dễ nhìn. Chọn kiểu phù hợp không gian của bạn: số lớn để nhìn từ xa, kiểu lật cho cảm giác cổ điển, tối giản cho bàn làm việc.', 'Nếu để cả đêm, hãy cắm sạc và giảm độ sáng để đỡ chói. Đặt máy ở nơi thoáng, tránh bị che hoặc quá nóng. Bạn có thể đổi giữa 12 giờ và 24 giờ, bật hoặc tắt hiển thị giây tuỳ thích.'),
           'tinh-luong-gio': ('Ước tính lương giờ và tiền tăng ca', 'Nếu được trả theo giờ, công cụ giúp bạn ước tính thu nhập từ số giờ làm thường và giờ tăng ca. Mức tối thiểu thường gặp theo Bộ luật Lao động là 150% ngày thường, 200% ngày nghỉ hằng tuần và 300% ngày lễ, chưa kể các khoản khác.', 'Kết quả chỉ mang tính tham khảo vì chưa tính thuế, bảo hiểm, phụ cấp hay thưởng, và mỗi công ty có cách tính riêng. Hãy đối chiếu với hợp đồng lao động và bảng lương thực tế khi cần.'),
           'chuoi-thoi-quen': ('Giữ thói quen bằng chuỗi ngày liên tiếp', 'Chuỗi ngày liên tiếp tạo động lực nhỏ nhưng hiệu quả: bạn không muốn làm đứt chuỗi. Hãy chọn thói quen thật nhỏ như đọc 10 trang, uống đủ nước hay đi bộ 15 phút, để dễ duy trì cả những ngày bận.', 'Đừng thêm quá nhiều thói quen một lúc, hai đến ba việc là đủ để bắt đầu. Nếu lỡ quên một ngày, hãy bắt đầu lại ngay hôm sau thay vì bỏ cuộc. Chuỗi dài nhất của bạn vẫn được giữ lại để nhìn lại thành quả.'),
           'mat-troi-moc-lan': ('Giờ mặt trời mọc lặn và giờ vàng chụp ảnh', 'Giờ mọc và lặn giúp bạn lên kế hoạch chạy bộ, đạp xe, leo núi hoặc đi biển đúng lúc, nhất là khi muốn về trước khi trời tối. Độ dài ngày thay đổi theo mùa và theo vĩ độ, nên miền Bắc chênh lệch giữa hè và đông rõ hơn miền Nam.', 'Giờ vàng là khoảng thời gian ngay sau khi mặt trời mọc và trước khi lặn, ánh sáng dịu và ấm, rất hợp để chụp ảnh. Hãy đến sớm khoảng 20 đến 30 phút để chọn góc. Giờ tính bằng công thức thiên văn nên có thể lệch vài phút so với dự báo chính thức.'),
           'may-go-nhip': ('Luyện đàn, trống với máy gõ nhịp', 'Máy gõ nhịp giúp bạn chơi đều tay và nhận ra chỗ mình hay vội hoặc chậm. Hãy bắt đầu ở tốc độ bạn chơi sạch hoàn toàn, rồi tăng khoảng 4 đến 5 BPM mỗi lần khi đã chơi đúng vài lượt liên tiếp.', 'Chế độ tăng tốc dần giúp việc này tự động. Bạn cũng có thể chia nhỏ nhịp để luyện nốt đôi, nốt ba hoặc nốt tư, và đặt phách mạnh theo nhịp bài như 3/4 hay 6/8. Thử tắt tiếng một vài phách để kiểm tra cảm giác nhịp của mình.'),
           'nhac-nen': ('Chọn âm thanh nền để tập trung', 'Không phải ai cũng tập trung tốt với nhạc có lời. Nhiều người thấy nhạc không lời hoặc âm thanh đều như mưa, ồn trắng, sóng biển ít gây phân tâm hơn. Hãy thử vài loại và chọn thứ phù hợp với bạn.', 'Khi kết nối với Pomodoro, nhạc chỉ phát lúc làm việc và dừng lúc nghỉ, giúp bạn phân biệt rõ giờ làm và giờ nghỉ. Nhạc bạn thêm nằm trong máy của bạn và được phát lại tại chỗ, không tải lên mạng.'),
           'ghi-gio-cong-viec': ('Biết thời gian của bạn đi đâu', 'Chúng ta thường đoán sai thời gian dành cho từng việc. Ghi giờ trong vài ngày sẽ cho thấy bạn thực sự dành bao nhiêu cho học, làm, họp hay lướt mạng. Đây là bước đầu để sắp xếp lại ngày của mình.', 'Hãy đặt tên việc ngắn và nhất quán để biểu đồ 7 ngày gom đúng nhóm. Đừng cố ghi hoàn hảo, chỉ cần đủ để thấy xu hướng. Nếu bạn làm tự do, số liệu này còn giúp bạn định phí theo giờ hợp lý hơn.'),
           'gio-hop-chung': ('Chọn giờ họp hợp lý cho nhiều múi giờ', 'Giờ họp tốt là giờ mọi người đều đang trong giờ làm. Chọn tối đa 4 thành phố, công cụ tô màu từng giờ để bạn thấy ngay khung nào phù hợp, khung nào chấp nhận được và khung nào là ban đêm.', 'Nếu không có khung nào hoàn hảo, hãy luân phiên người chịu giờ bất tiện giữa các lần họp để công bằng. Hãy ghi kèm ngày vì giờ có thể sang ngày khác ở nơi khác, và kiểm tra lại gần ngày chuyển giờ mùa hè.'), 'pace-chay-bo': ('Dùng pace để chạy đều và tiến bộ', 'Pace giúp bạn chạy đúng sức. Nhiều người mới chạy quá nhanh ở những km đầu rồi đuối ở cuối. Hãy chọn một pace bạn có thể giữ đều, và để ý pace trung bình cả buổi thay vì từng đoạn.', 'Khi muốn đặt mục tiêu, hãy xem dự đoán cho cự ly bạn nhắm tới rồi tăng dần theo từng tuần. Dự đoán chỉ là mốc tham khảo; nghỉ đủ, ngủ đủ và tăng quãng đường từ từ quan trọng hơn con số.'), 'vung-nhip-tim': ('Dùng vùng nhịp tim để tập đúng cường độ', 'Phần lớn buổi tập nên ở vùng nhẹ đến vừa để xây sức bền, và chỉ dành một phần nhỏ cho vùng nặng. Nhịp tim còn phụ thuộc giấc ngủ, nhiệt độ, caffeine và mức mệt, nên cùng một cường độ có thể cho nhịp khác nhau.', 'Nếu bạn đo nhịp tim bằng đồng hồ hoặc tự bắt mạch, hãy đối chiếu với các vùng ở đây để biết mình đang ở đâu. Cảm thấy chóng mặt, đau ngực hoặc khó thở thì dừng lại và đi khám.'), 'dem-lan': ('Tập theo hiệp để tăng dần', 'Chia buổi tập thành các hiệp giúp bạn nghỉ đúng lúc và theo dõi tiến bộ. Ví dụ hít đất 4 hiệp, mỗi hiệp đến gần mức mục tiêu, nghỉ khoảng một phút giữa các hiệp.', 'Hãy ghi số lần của từng hiệp và so với tuần trước. Khi làm đủ mục tiêu ở mọi hiệp, tăng thêm vài cái hoặc thêm một hiệp. Giữ đúng kỹ thuật quan trọng hơn làm thật nhiều.'), 'uong-nuoc': ('Cách giữ thói quen uống nước', 'Uống từng lượng nhỏ rải đều trong ngày thường dễ hơn uống dồn một lúc. Đặt một cốc cố định trên bàn, uống khi dậy, trước mỗi bữa và sau khi vận động.', 'Hãy chọn mục tiêu phù hợp với bạn và đừng so với người khác, vì nhu cầu thay đổi theo thời tiết và hoạt động. Nếu có bệnh về thận, tim hoặc được dặn hạn chế nước, hãy làm theo hướng dẫn của bác sĩ.'), 'on-tap-cach-quang': ('Vì sao ôn cách quãng giúp nhớ lâu', 'Chúng ta quên rất nhanh những gì mới học nếu không nhắc lại. Ôn đúng lúc sắp quên, rồi giãn dần khoảng cách, giúp kiến thức ở lại lâu hơn so với đọc đi đọc lại một mạch.', 'Mỗi lần ôn nên cố nhớ lại trước rồi mới mở bài ra kiểm tra. Hãy ghi mục thật cụ thể như Từ vựng bài 3 hay Công thức chương 2, để đến hạn bạn biết chính xác cần ôn gì.'), 'tien-do-den-han': ('Chia nhỏ việc lớn thành mức mỗi ngày', 'Việc lớn dễ bị trì hoãn vì không biết bắt đầu từ đâu. Khi đổi nó thành một con số mỗi ngày, bạn có thể bắt tay ngay và biết mình đang kịp hay trễ.', 'Hãy cập nhật phần đã làm đều đặn và tính lại. Nếu mức mỗi ngày tăng lên, đó là dấu hiệu nên bàn lại hạn, cắt bớt khối lượng hoặc dành thêm thời gian. Dự phòng 20% giúp bạn không bị đẩy vào đường cùng khi có việc phát sinh.'), 'dem-tu': ('Thời gian đọc và thuyết trình thực tế', 'Tốc độ đọc và nói khác nhau theo người, nội dung và mức khó. Văn bản có số liệu hoặc thuật ngữ thường đọc chậm hơn, còn khi thuyết trình bạn cần dừng nghỉ và chuyển slide.', 'Hãy đọc thử to một đoạn, tính tốc độ của bạn rồi nhập vào ô tốc độ để có ước tính sát hơn. Với bài thuyết trình, nên để dư vài phút phòng khi bị hỏi hoặc nói chậm lại vì hồi hộp.'), 'tuan-trong-nam': ('Khi nào cần biết số tuần trong năm', 'Nhiều công ty, trường học và đơn vị vận chuyển lập kế hoạch theo số tuần, ví dụ tuần 12 nộp báo cáo hay tuần 40 giao hàng. Biết đúng số tuần giúp bạn trao đổi không bị lệch.', 'Lưu ý có nơi đánh số tuần theo cách khác, như tuần bắt đầu từ Chủ nhật. Khi làm việc với đối tác, hãy hỏi rõ họ dùng chuẩn nào. Chuẩn ISO ở đây được dùng rộng rãi trong kinh doanh và quốc tế.'), 'gio-xuat-phat': ('Dự phòng thế nào cho hợp lý', 'Thời gian di chuyển bạn biết thường là lúc đường thoáng. Vào giờ cao điểm, khi mưa hoặc khi đi nơi lạ, hãy cộng thêm. Nếu cần gửi xe, tìm đường hay đi thang máy, tính thêm vài phút nữa.', 'Với việc quan trọng như phỏng vấn, đi thi hay ra sân bay, nên đến sớm hơn giờ cần đến một chút và dự phòng rộng. Đến sớm bạn có thể ngồi nghỉ, còn đến trễ thì không có cách cứu.')}
          PRIV = 'chinh-sach-quyen-rieng'
          def with_more(t, s):
              m = MORE.get(t['slug'])
              if m:
                  block = '<h2>%s</h2><p>%s</p><p>%s</p>' % (esc(m[0]), esc(m[1]), esc(m[2]))
                  s = s.replace('<h2>Câu hỏi thường gặp</h2>', block + '<h2>Câu hỏi thường gặp</h2>', 1)
              s = s.replace('<p><a href="./">Trang chủ Bấm giờ</a></p>', '<p><a href="./">Trang chủ Bấm giờ</a> · <a href="' + PRIV + '">Chính sách quyền riêng tư</a></p>', 1)
              return s
          BY = {t['slug']: t for t in T}
          CSS = ('*{box-sizing:border-box}body{margin:0;font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f8fa;color:#14202b}'
           '@media(prefers-color-scheme:dark){body{background:#0d1620;color:#e6edf3}a{color:#5eead4}.card{background:#14202b!important;border-color:#233446!important}}'
           'header,main,footer{max-width:760px;margin:0 auto;padding:14px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}'
           'header a.brand{font-weight:800;text-decoration:none;color:inherit}h1{font-size:28px;line-height:1.25;margin:10px 0}h2{font-size:20px;margin:28px 0 8px}'
           'a{color:#0f766e}.cta{display:inline-block;margin:10px 0;padding:14px 22px;border-radius:14px;background:#2dbe9d;color:#04231c;font-weight:800;text-decoration:none}'
           '.card{background:#fff;border:1px solid #dde6ee;border-radius:14px;padding:12px 16px;margin:8px 0}.small{font-size:14px;opacity:.8}'
           'ul,ol{padding-left:22px}li{margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.grid a{display:block;text-decoration:none}.grid b{display:block}')
          def esc(x): return html.escape(x, quote=True)
          def page(t):
              url = BASE + t['slug']
              app = BASE + '?tool=' + t['k']
              faq = [{'@type': 'Question', 'name': q, 'acceptedAnswer': {'@type': 'Answer', 'text': a}} for q, a in t['faq']]
              ld = [{'@context': 'https://schema.org', '@type': 'SoftwareApplication', 'name': 'Bấm giờ: ' + t['name'], 'applicationCategory': 'UtilitiesApplication', 'operatingSystem': 'Web, Android', 'url': url, 'description': t['desc'], 'inLanguage': 'vi', 'offers': {'@type': 'Offer', 'price': '0', 'priceCurrency': 'VND'}},
                    {'@context': 'https://schema.org', '@type': 'FAQPage', 'mainEntity': faq},
                    {'@context': 'https://schema.org', '@type': 'BreadcrumbList', 'itemListElement': [{'@type': 'ListItem', 'position': 1, 'name': 'Bấm giờ', 'item': BASE}, {'@type': 'ListItem', 'position': 2, 'name': 'Công cụ', 'item': BASE + 'cong-cu'}, {'@type': 'ListItem', 'position': 3, 'name': t['name'], 'item': url}]}]
              rel = ''.join('<a class="card" href="%s"><b>%s</b>%s</a>' % (r, esc(BY[r]['name']), esc(BY[r]['title'])) for r in t['rel'])
              allv = ' · '.join('<a href="%s">%s</a>' % (x['slug'], esc(x['name'])) for x in T)
              return ('<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
                '<title>%s | Bấm giờ</title><meta name="description" content="%s"><link rel="canonical" href="%s">'
                '<meta name="theme-color" content="#0b1d2a"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json">'
                '<meta property="og:type" content="website"><meta property="og:locale" content="vi_VN"><meta property="og:title" content="%s"><meta property="og:description" content="%s"><meta property="og:url" content="%s"><meta property="og:image" content="%sog-image.png">'
                '<meta name="twitter:card" content="summary_large_image">'
                '<script type="application/ld+json">%s</script><style>%s</style></head><body>'
                '<header><a class="brand" href="./" aria-label="Bấm giờ, về trang chủ">⏱ Bấm giờ</a><nav aria-label="Chính"><a href="cong-cu">Tất cả công cụ</a></nav></header><main>'
                '<h1>%s</h1><p>%s</p><a class="cta" href="%s">Mở %s ngay</a><p class="small">Miễn phí, không cần đăng ký, chạy ngay trên trình duyệt.</p>'
                '<h2>Công cụ này làm được gì</h2><ul>%s</ul><h2>Cách dùng</h2><ol>%s</ol>'
                '<h2>Câu hỏi thường gặp</h2>%s<h2>Công cụ liên quan</h2>%s'
                '<h2>Cài thành app</h2><p>Bấm giờ có thể cài lên màn hình chính từ trình duyệt, hoặc tải bản Android để dùng thông báo, nhạc chạy nền và đọc giờ bằng giọng nói. <a href="%s">Tải app Android (APK)</a>. Dữ liệu của bạn lưu ngay trong máy, không gửi lên máy chủ.</p>'
                '</main><footer class="small"><p>%s</p><p><a href="./">Trang chủ Bấm giờ</a></p></footer></body></html>') % (
                esc(t['title']), esc(t['desc']), url, esc(t['title']), esc(t['desc']), url, BASE,
                json.dumps(ld, ensure_ascii=False).replace('</', '<\\/'), CSS,
                esc(t['title']), esc(t['lead']), app, esc(t['name']),
                ''.join('<li>%s</li>' % esc(f) for f in t['feats']), ''.join('<li>%s</li>' % esc(s) for s in t['steps']),
                ''.join('<div class="card"><b>%s</b><div>%s</div></div>' % (esc(q), esc(a)) for q, a in t['faq']), rel, APK, allv)
          def hub():
              items = ''.join('<a class="card" href="%s"><b>%s</b>%s</a>' % (t['slug'], esc(t['name']), esc(t['desc'])) for t in T)
              ld = {'@context': 'https://schema.org', '@type': 'CollectionPage', 'name': 'Tất cả công cụ Bấm giờ', 'url': BASE + 'cong-cu', 'inLanguage': 'vi'}
              return ('<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
                '<title>Tất cả công cụ: đồng hồ, hẹn giờ, lịch âm, tính ngày | Bấm giờ</title>'
                '<meta name="description" content="25 công cụ thời gian miễn phí: bấm giờ, đếm ngược, Pomodoro, lịch âm, tính tuổi, máy gõ nhịp, giờ họp chung và nhiều hơn nữa.">'
                '<link rel="canonical" href="%scong-cu"><meta name="theme-color" content="#0b1d2a"><link rel="icon" href="icon-192.png">'
                '<script type="application/ld+json">%s</script><style>%s</style></head><body><header><a class="brand" href="./" aria-label="Bấm giờ, về trang chủ">⏱ Bấm giờ</a><nav aria-label="Chính"><a href="./">Mở ứng dụng</a></nav></header>'
                '<main><h1>Tất cả công cụ của Bấm giờ</h1><p>Hơn hai mươi công cụ về thời gian, miễn phí, không cần đăng ký, dùng được trên điện thoại và máy tính.</p><div class="grid">%s</div></main></body></html>') % (BASE, json.dumps(ld, ensure_ascii=False), CSS, items)
          os.makedirs(OUT, exist_ok=True)
          def lastmod(path):
              try:
                  d = subprocess.check_output(['git', 'log', '-1', '--format=%cs', '--', path], text=True).strip()
              except Exception:
                  d = ''
              return d or datetime.date.today().isoformat()
          def notfound():
              return ('<!doctype html><html lang="vi"><head><meta charset="utf-8">'
                      '<meta name="viewport" content="width=device-width,initial-scale=1">'
                      '<meta name="robots" content="noindex"><title>Không tìm thấy trang | Bấm giờ</title>'
                      '<link rel="icon" href="icon-192.png"><style>' + CSS + '</style></head><body>'
                      '<header><a class="brand" href="./">⏱ Bấm giờ</a><nav aria-label="Chính"><a href="cong-cu">Tất cả công cụ</a></nav></header>'
                      '<main><h1>Không tìm thấy trang</h1><p>Đường dẫn này không tồn tại hoặc đã được đổi tên.</p>'
                      '<a class="cta" href="./">Về trang chủ Bấm giờ</a></main>'
                      '<footer class="small"><p><a href="./">Trang chủ</a></p></footer></body></html>')
          for t in T:
              s = with_more(t, page(t))
              s = s.replace('<meta name="theme-color" content="#0b1d2a">',
                            '<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">'
                            '<meta name="theme-color" content="#0d1620" media="(prefers-color-scheme: dark)">', 1)
              s = s.replace('<meta name="twitter:card" content="summary_large_image">',
                            '<meta name="twitter:card" content="summary_large_image">'
                            '<meta name="twitter:title" content="' + esc(t['title']) + '">'
                            '<meta name="twitter:description" content="' + esc(t['desc']) + '">'
                            '<meta name="twitter:image" content="' + BASE + 'og-image.png">'
                            '<meta property="og:image:width" content="1200">'
                            '<meta property="og:image:height" content="630">'
                            '<meta property="og:image:alt" content="' + esc(t['name']) + '">', 1)
              open(os.path.join(OUT, t['slug'] + '.html'), 'w', encoding='utf-8').write(s)
          hub_html = hub().replace('25 công cụ thời gian miễn phí', '%d công cụ thời gian miễn phí' % len(T), 1)
          hub_html = hub_html.replace('</main></body></html>', '<p class="small"><a href="' + PRIV + '">Chính sách quyền riêng tư</a></p></main></body></html>', 1)
          open(os.path.join(OUT, 'cong-cu.html'), 'w', encoding='utf-8').write(hub_html)
          open(os.path.join(OUT, '404.html'), 'w', encoding='utf-8').write(notfound())
          pages = [(BASE, 'index.html'), (BASE + 'cong-cu', 'cong-cu.html'), (BASE + PRIV, PRIV + '.html')]
          pages += [(BASE + t['slug'], t['slug'] + '.html') for t in T]
          urls = ''.join('<url><loc>%s</loc><lastmod>%s</lastmod></url>\n' % (u, lastmod(p)) for u, p in pages)
          open(os.path.join(OUT, 'sitemap.xml'), 'w', encoding='utf-8').write('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + urls + '</urlset>\n')
          open(os.path.join(OUT, 'robots.txt'), 'w', encoding='utf-8').write('User-agent: *\nAllow: /\n\nSitemap: ' + BASE + 'sitemap.xml\n')
          print('Đã tạo', len(T), 'trang công cụ, trang tổng hợp, sitemap.xml và robots.txt')
          PY

      - name: Lưu vào repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "Cập nhật trang giới thiệu các công cụ"
            git push
          fi

      - name: Yêu cầu GitHub Pages dựng lại web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Bỏ qua, Pages sẽ tự cập nhật"
