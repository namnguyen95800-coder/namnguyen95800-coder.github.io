            faq=[('Phiên ngắn có được lưu không?','Phiên dưới 5 giây sẽ bị bỏ qua. Phiên từ 20 giây trở lên được cộng vào thống kê.'),('Có xuất ra bảng tính không?','Thống kê tổng hợp có thể xuất CSV từ mục Mục tiêu, xuất và xoá dữ liệu.')],
