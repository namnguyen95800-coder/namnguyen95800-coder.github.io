           dict(k='meet', slug='gio-hop-chung', name='Họp chung',
            title='Tìm giờ họp chung nhiều múi giờ, giờ họp quốc tế',
            desc='Chọn tối đa 4 thành phố để tìm khung giờ họp mà mọi người đều trong giờ làm. Tính đúng giờ mùa hè, mùa đông. Miễn phí.',
            lead='Họp với đồng nghiệp hay khách hàng ở nhiều nước rất dễ nhầm giờ. Công cụ này hiện bảng 24 giờ và tô màu giờ nào phù hợp với tất cả.',
            feats=['15 thành phố phổ biến, chọn tối đa 4','Tô xanh giờ làm 9h–18h, vàng giờ chấp nhận được 7h–22h, xám giờ ban đêm','Gợi ý khung giờ cả nhóm đều trong giờ làm','Tự tính giờ mùa hè, mùa đông theo ngày bạn chọn'],
